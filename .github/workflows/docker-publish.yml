# 自动构建并推送 Docker 镜像：一次构建，同时推两个仓库
#
#   ghcr.io/andersonfeng/xiaosa-ktv        用仓库自带的 GITHUB_TOKEN，不需要额外配置
#   andersonfeng/xiaosa-ktv（Docker Hub）   需要先在 Settings → Secrets 里配
#                                          DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#                                          没配的时候自动只推 GHCR，不会让 CI 变红
#
# 触发方式（2026-11 起：只在打版本 tag 时构建）：
#   - push 形如 v1.3.7 的 tag：构建 amd64 镜像，推 1.3.7 / 1.3 / latest
#   - 也可以在 Actions 页面手动 Run workflow
#   - push 到 main / master 不再触发构建（省 CI，也避免仓库里出现分支名标签）
#
# 关于标签：以前有一条 type=ref,event=branch，会把分支名当成镜像标签，于是每发一版
# 都会多出一个 `master` 标签，和 latest 内容重复。已经删掉，现在只会出现：
#   打 vX.Y.Z → X.Y.Z、X.Y、latest
# 已经推到仓库里的旧 master 标签不会自动消失，需要手动删（见 README）。

name: Build and push image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # 必须全小写：镜像仓库名不允许大写字母
  IMAGE_NAME: ghcr.io/andersonfeng/xiaosa-ktv
  DOCKERHUB_IMAGE: andersonfeng/xiaosa-ktv

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 需要构建 arm64 时再打开下面这行（会慢很多：better-sqlite3 要在 QEMU 里编译）
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      # 有 DOCKERHUB_TOKEN 才把 Docker Hub 加进要推的镜像列表：
      # 这样"没配密钥的仓库/PR"也能正常推 GHCR，不会因为缺 Docker Hub 凭据整条挂掉。
      - name: Decide target registries
        id: targets
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<IMAGES_EOF"
              echo "$IMAGE_NAME"
              echo "$DOCKERHUB_IMAGE"
              echo "IMAGES_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "将同时推送到 GHCR 和 Docker Hub"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            {
              echo "images<<IMAGES_EOF"
              echo "$IMAGE_NAME"
              echo "IMAGES_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "未配置 DOCKERHUB_TOKEN，本次只推 GHCR"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags / labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          # 不再用 type=ref,event=branch：那会给每个分支打一个同名标签
          # （master/main），内容跟 latest 完全一样，纯属仓库里的噪音。
          # 只在 tag 上构建（见文件顶部 on:），所以 latest 直接无条件跟着版本走。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app/docker
          file: ./app/docker/Dockerfile
          # 需要 arm64（群晖/树莓派等）就改成：linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
